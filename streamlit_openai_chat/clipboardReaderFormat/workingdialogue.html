<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialogue Reader & Editor</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function DialogueSplitter() {
            const [lines, setLines] = useState([]);
            const [originalLines, setOriginalLines] = useState([]);
            const [currentLineIndex, setCurrentLineIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [editingIndex, setEditingIndex] = useState(null);
            const [editText, setEditText] = useState('');
            const utteranceRef = useRef(null);
            const editTextareaRef = useRef(null);

            // Parse clipboard text in format: "speaker: text"
            const parseClipboardText = (text) => {
                const parsedLines = [];
                const rawLines = text.split('\n').filter(line => line.trim());

                rawLines.forEach(line => {
                    const colonIndex = line.indexOf(':');
                    if (colonIndex > 0) {
                        const speaker = line.substring(0, colonIndex).trim();
                        const text = line.substring(colonIndex + 1).trim();
                        if (speaker && text) {
                            parsedLines.push({ speaker, text });
                        }
                    }
                });

                return parsedLines;
            };

            // Paste from clipboard
            const handlePaste = async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    const parsed = parseClipboardText(text);
                    if (parsed.length > 0) {
                        setLines(parsed);
                        setOriginalLines(JSON.parse(JSON.stringify(parsed)));
                        setCurrentLineIndex(0);
                        stopSpeech();
                    } else {
                        alert('No valid dialogue format found. Use format:\nspeaker: text');
                    }
                } catch (err) {
                    alert('Failed to read clipboard. Please paste manually.');
                }
            };

            // Export to clipboard for AI comparison
            const exportForAI = async () => {
                if (lines.length === 0) return;

                const originalFormatted = originalLines.map(line => `${line.speaker}: ${line.text}`).join('\n');
                const editedFormatted = lines.map(line => `${line.speaker}: ${line.text}`).join('\n');
                const prompt = `Compare these two dialogues and provide feedback:\n\nOriginal Dialogue:\n${originalFormatted}\n\nYour Response:\n${editedFormatted}`;

                try {
                    await navigator.clipboard.writeText(prompt);
                    alert('Prompt copied to clipboard!');
                } catch (err) {
                    alert('Failed to copy to clipboard');
                }
            };

            // Text-to-Speech
            const speakLine = (index) => {
                stopSpeech();
                if (index >= 0 && index < lines.length) {
                    const line = lines[index];
                    const lineNumber = index + 1;
                    const textToSpeak = `${lineNumber}. ${line.speaker} says: ${line.text}`;

                    utteranceRef.current = new SpeechSynthesisUtterance(textToSpeak);
                    utteranceRef.current.rate = 0.9;
                    utteranceRef.current.onend = () => {
                        if (isPlaying && index < lines.length - 1) {
                            setTimeout(() => {
                                setCurrentLineIndex(index + 1);
                                speakLine(index + 1);
                            }, 500);
                        } else {
                            setIsPlaying(false);
                        }
                    };

                    window.speechSynthesis.speak(utteranceRef.current);
                }
            };

            const stopSpeech = () => {
                const emptyUtterance = new SpeechSynthesisUtterance('');
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(emptyUtterance);
                setIsPlaying(false);
            };

            const startPlayback = () => {
                if (!isPlaying) {
                    setIsPlaying(true);
                    speakLine(currentLineIndex);
                }
            };

            // Edit line
            const startEdit = (index) => {
                console.log('✏️ Starting edit for line', index, ':', lines[index].text);
                setEditingIndex(index);
                setEditText(''); // Start with empty textarea

                setTimeout(() => {
                    if (editTextareaRef.current) {
                        editTextareaRef.current.focus();
                        console.log('🎯 Focused edit textarea');
                    }
                }, 50);
            };

            const saveEdit = () => {
                if (editingIndex !== null) {
                    const newLines = [...lines];
                    newLines[editingIndex].text = editText;
                    setLines(newLines);
                    setEditingIndex(null);
                    setEditText('');
                }
            };

            const cancelEdit = () => {
                console.log('❌ Canceling edit');
                setEditingIndex(null);
                setEditText('');
            };

            const appendCurrent = () => {
                if (editingIndex !== null && lines[editingIndex]) {
                    const currentLineText = lines[editingIndex].text;
                    if (editText) {
                        // If there's already text, add a space before appending
                        setEditText(editText + ' ' + currentLineText);
                    } else {
                        // If empty, just add the current line text
                        setEditText(currentLineText);
                    }

                    // Focus textarea after appending
                    setTimeout(() => {
                        if (editTextareaRef.current) {
                            editTextareaRef.current.focus();
                            // Move cursor to end
                            const length = editTextareaRef.current.value.length;
                            editTextareaRef.current.setSelectionRange(length, length);
                        }
                    }, 50);
                }
            };

            // Keyboard navigation
            useEffect(() => {
                const handleKeyDown = (e) => {
                    const isModalOpen = editingIndex !== null;
                    console.log(`🔑 Key pressed: "${e.key}" | Modal open: ${isModalOpen} | Target: ${e.target.tagName}`);

                    // Check if modal is open - if so, only allow Escape and backtick
                    if (isModalOpen) {
                        console.log('📝 Modal is open - handling special keys only');
                        if (e.key === 'Escape') {
                            console.log('❌ Escape pressed - closing modal');
                            e.preventDefault();
                            e.stopPropagation();
                            cancelEdit();
                        } else if (e.key === '`') {
                            console.log('📥 Backtick pressed - appending current text');
                            e.preventDefault();
                            e.stopPropagation();
                            appendCurrent();
                        }
                        return; // Exit early - don't process other keys when modal is open
                    }

                    // Check if target is an input/textarea (but not our edit modal)
                    if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
                        console.log('⏭️ Skipping - typing in form field');
                        return; // Don't interfere with typing in form fields
                    }

                    if (e.key === 'ArrowUp') {
                        console.log('⬆️ Arrow Up - previous line');
                        e.preventDefault();
                        stopSpeech();
                        setCurrentLineIndex(prev => Math.max(0, prev - 1));
                    } else if (e.key === 'ArrowDown') {
                        console.log('⬇️ Arrow Down - next line');
                        e.preventDefault();
                        stopSpeech();
                        setCurrentLineIndex(prev => Math.min(lines.length - 1, prev + 1));
                    } else if (e.key === ' ') {
                        console.log('⏸️ Space - stop speech');
                        e.preventDefault();
                        if (isPlaying) {
                            stopSpeech();
                        }
                    } else if (e.key === 'Enter') {
                        console.log('▶️ Enter - start playback');
                        e.preventDefault();
                        startPlayback();
                    } else if (e.key === 'Escape') {
                        console.log('⏹️ Escape - stop speech');
                        e.preventDefault();
                        stopSpeech();
                    } else if (e.key === '`') {
                        console.log('✏️ Backtick - opening edit modal');
                        e.preventDefault();
                        e.stopPropagation();
                        startEdit(currentLineIndex);
                    } else if (e.key >= '0' && e.key <= '9') {
                        const lineNum = parseInt(e.key);
                        console.log(`🔢 Number ${lineNum} - jump to line`);
                        if (lineNum > 0 && lineNum <= lines.length) {
                            setCurrentLineIndex(lineNum - 1);
                            stopSpeech();
                        }
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [lines.length, editingIndex, isPlaying, currentLineIndex]);

            // Auto-scroll to current line
            useEffect(() => {
                console.log('📜 Scroll effect triggered - currentLineIndex:', currentLineIndex, 'editingIndex:', editingIndex);
                if (editingIndex === null) {
                    const element = document.getElementById(`line-${currentLineIndex}`);
                    if (element) {
                        console.log('✅ Scrolling to line', currentLineIndex);
                        element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else {
                    console.log('⏸️ Skipping scroll - currently editing');
                }
            }, [currentLineIndex, editingIndex]);

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 p-8">
                    <div className="max-w-4xl mx-auto">
                        <h1 className="text-3xl font-bold text-gray-800 mb-6">📝 Dialogue Reader & Editor</h1>

                        {/* Controls */}
                        <div className="bg-white rounded-lg shadow-lg p-4 mb-6">
                            <div className="flex gap-2 flex-wrap items-center">
                                <button
                                    onClick={handlePaste}
                                    className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition"
                                >
                                    📋 Paste from Clipboard
                                </button>
                                <button
                                    onClick={startPlayback}
                                    className="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition"
                                    disabled={lines.length === 0 || isPlaying}
                                >
                                    ▶️ Play
                                </button>
                                <button
                                    onClick={stopSpeech}
                                    className="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition"
                                    disabled={lines.length === 0 || !isPlaying}
                                >
                                    ⏹️ Stop (Space)
                                </button>
                                <button
                                    onClick={() => { setCurrentLineIndex(0); stopSpeech(); }}
                                    className="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition"
                                    disabled={lines.length === 0}
                                >
                                    🔄 Reset
                                </button>
                                <button
                                    onClick={exportForAI}
                                    className="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition"
                                    disabled={lines.length === 0}
                                >
                                    🤖 Export for AI
                                </button>
                                <button
                                    onClick={() => { setLines([]); setOriginalLines([]); }}
                                    className="px-4 py-2 bg-gray-400 text-white rounded-lg hover:bg-gray-500 transition"
                                >
                                    🗑️ Clear
                                </button>
                            </div>

                            {lines.length > 0 && (
                                <div className="mt-4 text-sm text-gray-600">
                                    <p>⌨️ Keyboard: ↑↓ Navigate | Enter Play | Space/Esc Stop | ` Edit | 1-9 Jump to line</p>
                                    <p>📊 Line {currentLineIndex + 1} / {lines.length}</p>
                                </div>
                            )}
                        </div>

                        {/* Edit Textarea Overlay */}
                        {editingIndex !== null && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                                <div className="bg-white rounded-lg shadow-xl p-6 max-w-2xl w-full mx-4">
                                    <h3 className="text-lg font-bold text-gray-800 mb-2">
                                        Edit Line #{editingIndex + 1} - {lines[editingIndex]?.speaker}
                                    </h3>
                                    <textarea
                                        ref={editTextareaRef}
                                        value={editText}
                                        onChange={(e) => setEditText(e.target.value)}
                                        className="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        rows={4}
                                    />
                                    <div className="flex gap-2 mt-4">
                                        <button
                                            onClick={saveEdit}
                                            className="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600"
                                        >
                                            ✓ Save
                                        </button>
                                        <button
                                            onClick={cancelEdit}
                                            className="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600"
                                        >
                                            ✕ Cancel (Esc)
                                        </button>
                                        <button
                                            onClick={appendCurrent}
                                            className="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
                                        >
                                            📥 Append Current
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Dialogue Display */}
                        <div className="bg-white rounded-lg shadow-lg p-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-4">Dialogue</h2>
                            <div className="space-y-2 max-h-[600px] overflow-y-auto">
                                {lines.length === 0 ? (
                                    <div className="text-center py-12 text-gray-400">
                                        <p className="mb-2">📋 Click "Paste from Clipboard" to load dialogue</p>
                                        <p className="text-sm">Format: speaker: text on each line</p>
                                        <p className="text-xs mt-4 text-gray-500">Example:</p>
                                        <pre className="text-left inline-block text-xs mt-2 p-3 bg-gray-50 rounded">
interviewer: what do you expect from this
me: this is going to be a great interview
interviewer: yes you need to get about and do that
                                        </pre>
                                    </div>
                                ) : (
                                    lines.map((line, index) => {
                                        const isCurrent = index === currentLineIndex;

                                        return (
                                            <div
                                                key={index}
                                                id={`line-${index}`}
                                                className={`p-3 rounded-lg border-l-4 transition-all ${
                                                    isCurrent
                                                        ? 'bg-yellow-100 border-yellow-500 shadow-md scale-105'
                                                        : 'bg-gray-50 border-gray-300'
                                                }`}
                                            >
                                                <div className="flex items-start justify-between gap-2">
                                                    <div className="flex-1">
                                                        <span className="text-xs text-gray-500 mr-2">#{index + 1}</span>
                                                        <span className="font-semibold text-blue-600">{line.speaker}:</span>
                                                        <p className="text-gray-700 mt-1">{line.text}</p>
                                                    </div>
                                                    <div className="flex gap-1">
                                                        <button
                                                            onClick={() => { setCurrentLineIndex(index); speakLine(index); }}
                                                            className="px-2 py-1 bg-blue-500 text-white text-xs rounded hover:bg-blue-600"
                                                        >
                                                            🔊
                                                        </button>
                                                        <button
                                                            onClick={() => startEdit(index)}
                                                            className="px-2 py-1 bg-orange-500 text-white text-xs rounded hover:bg-orange-600"
                                                        >
                                                            ✏️
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DialogueSplitter />);
    </script>
</body>
</html>
